name: Build and upload to PyPI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_linux_wheels:
    name: Build ${{ matrix.python.tag }} wheel on Linux ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - interpreter: cp310-cp310
            tag: cp310-abi3
          - interpreter: cp314-cp314t
            tag: cp314t
        platform:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
            platform_id: manylinux_x86_64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
            platform_id: manylinux_aarch64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build wheel in manylinux2014 container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e VERSIONEER_CLOSEST_TAG_ONLY=1 \
            -e XLLAMACPP_RELEASE=1 \
            -e XLLAMACPP_BUILD_AARCH64=${{ matrix.platform.arch == 'aarch64' && '1' || '' }} \
            ${{ matrix.platform.image }} \
            bash -c '
              set -ex

              # Mark the mounted workspace as safe for git (needed by versioneer)
              git config --global --add safe.directory /workspace
              export PATH=/opt/python/${{ matrix.python.interpreter }}/bin:$PATH

              # Install Rust toolchain (needed by llguidance)
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env

              # Install build dependencies
              pip install -r requirements.txt

              # Build the wheel
              pip wheel . --no-deps --no-build-isolation -w /tmp/wheelhouse

              # Repair the wheel with auditwheel
              auditwheel show /tmp/wheelhouse/*.whl
              auditwheel repair \
                --exclude libstdc++.so.6 \
                --exclude libgomp.so.1 \
                -w /workspace/wheelhouse \
                /tmp/wheelhouse/*.whl
            '

      - name: Upload wheel artifact
        id: upload_wheel
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.python.tag }}-${{ matrix.platform.platform_id }}
          path: wheelhouse/*.whl

      - name: Retry wheel artifact upload
        if: steps.upload_wheel.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.python.tag }}-${{ matrix.platform.platform_id }}
          path: wheelhouse/*.whl
          overwrite: true

  build_other_wheels:
    name: Build ${{ matrix.python.tag }} wheel on ${{ matrix.platform.os }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    strategy:
      fail-fast: false
      matrix:
        python:
          - selector: cp310
            tag: cp310-abi3
          - selector: cp314t
            tag: cp314t
        platform:
          # macOS x86_64
          - os: macos-15-intel
            arch: x86_64
            platform_id: macosx_x86_64

          # macOS arm64
          - os: macos-14
            arch: arm64
            platform_id: macosx_arm64

          # Windows AMD64
          - os: windows-2022
            arch: AMD64
            platform_id: win_amd64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add msbuild to PATH
        if: ${{ startsWith(matrix.platform.os, 'windows-') }}
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          vs-version: '[17.13,17.14)'

      - name: Build wheels
        uses: pypa/cibuildwheel@54a71d3375df80d84b6d4537d04614fec04e637f # v3.4.0
        env:
          VERSIONEER_CLOSEST_TAG_ONLY: 1
          CIBW_SKIP: "*i686"
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          # cp310 produces the Python 3.10+ abi3 wheel; cp314t produces the
          # dedicated free-threaded wheel required by Python 3.14t.
          CIBW_BUILD: ${{ matrix.python.selector }}-*
          CIBW_TEST_REQUIRES: pytest requests pytest-asyncio pytest-timeout
          CIBW_BEFORE_BUILD: pip install -r requirements.txt
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT_MACOS: "XLLAMACPP_RELEASE=1 XLLAMACPP_BUILD_AARCH64=${{ matrix.platform.arch == 'aarch64' && '1' || '' }}"
          CIBW_ENVIRONMENT_WINDOWS: "XLLAMACPP_RELEASE=1 XLLAMACPP_BUILD_AARCH64=${{ matrix.platform.arch == 'aarch64' && '1' || '' }}"
        with:
          package-dir: ./

      - name: Upload wheel artifact
        id: upload_wheel
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.python.tag }}-${{ matrix.platform.platform_id }}
          path: wheelhouse/*.whl

      - name: Retry wheel artifact upload
        if: steps.upload_wheel.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.python.tag }}-${{ matrix.platform.platform_id }}
          path: wheelhouse/*.whl
          overwrite: true

  test_wheels:
    name: Test ${{ matrix.python.version }} wheel on ${{ matrix.platform.os }} ${{ matrix.platform.arch }}
    needs: [build_linux_wheels, build_other_wheels]
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.14"
            artifact_tag: cp310-abi3
          - version: "3.14t"
            artifact_tag: cp314t
        platform:
          - os: ubuntu-latest
            arch: x86_64
            artifact: manylinux_x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
            artifact: manylinux_aarch64
          - os: macos-15-intel
            arch: x86_64
            artifact: macosx_x86_64
          - os: macos-14
            arch: arm64
            artifact: macosx_arm64
          - os: windows-2022
            arch: AMD64
            artifact: win_amd64

    steps:
      - name: Set up Python ${{ matrix.python.version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python.version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.python.artifact_tag }}-${{ matrix.platform.artifact }}
          path: wheelhouse

      - name: Install and import wheel
        run: |
          python -m pip install wheelhouse/*.whl
          python -c "import xllamacpp; import xllamacpp.xllamacpp"

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload source artifact
        id: upload_source
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: ./dist/*.tar.gz

      - name: Retry source artifact upload
        if: steps.upload_source.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: ./dist/*.tar.gz
          overwrite: true

  upload_pypi:
    needs: [test_wheels, build_sdist]
    runs-on: ubuntu-latest
    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: 'wheel-*'
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          name: artifacts

      - name: Publish to PyPI
        if: github.repository == 'xorbitsai/xllamacpp'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}

      - name: Publish to Test PyPI
        if: github.repository != 'xorbitsai/xllamacpp'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_PASSWORD }}
          repository_url: https://test.pypi.org/legacy/
